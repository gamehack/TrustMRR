name: TrustMRR Weekly Notion Producer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 17:00 UTC = Monday 01:00 Asia/Shanghai (UTC+8).
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustmrr-weekly-notion
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python stdlib tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q trustmrr

  notion-check:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Notion permission check
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: 4109e605-ccf8-81ed-a46c-f9ab95538f5b
        run: python -m trustmrr.main check

  live-preflight:
    # One-off live integration run is opt-in via an explicit commit message.
    # It reads Notion, fetches TrustMRR, calls OmniRoute, and never writes a page.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-preflight]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRUSTMRR_RESEARCH_AUTHORIZED: ${{ vars.TRUSTMRR_RESEARCH_AUTHORIZED }}
      TRUSTMRR_AI_AUTHORIZED: ${{ vars.TRUSTMRR_AI_AUTHORIZED }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: 4109e605-ccf8-81ed-a46c-f9ab95538f5b
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live API preflight (no Notion writes)
        run: python -m trustmrr.main preflight

  notion-write-test:
    # Explicit one-off write verification. Creates only a clearly labeled test child page.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[notion-write-test]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_ENABLE_SYNC: 'true'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: 4109e605-ccf8-81ed-a46c-f9ab95538f5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and verify labeled Notion test page
        run: python -m trustmrr.main write-test

  activate-production:
    # One-time cutover: only a commit explicitly tagged [activate-production] may enable the repo variable.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-production]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Enable and verify scheduled production variable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          variable_url="https://api.github.com/repos/${REPOSITORY}/actions/variables/TRUSTMRR_PRODUCTION_ENABLED"
          collection_url="https://api.github.com/repos/${REPOSITORY}/actions/variables"
          code="$(curl --silent --show-error --output /tmp/variable.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${variable_url}")"
          if [ "${code}" = "200" ]; then
            curl --fail --silent --show-error --request PATCH "${variable_url}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data '{"name":"TRUSTMRR_PRODUCTION_ENABLED","value":"true"}' >/dev/null
          elif [ "${code}" = "404" ]; then
            curl --fail --silent --show-error --request POST "${collection_url}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data '{"name":"TRUSTMRR_PRODUCTION_ENABLED","value":"true"}' >/dev/null
          else
            echo "Unable to inspect repository variable; HTTP ${code}"
            exit 1
          fi
          value="$(curl --fail --silent --show-error "${variable_url}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            | python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')"
          test "${value}" = "true"
          echo "TRUSTMRR_PRODUCTION_ENABLED=true verified"

  full-integration-test:
    # Real TrustMRR -> OmniRoute -> Notion READY chain; isolated test key/title, no publisher match.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[full-integration-test]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUSTMRR_RESEARCH_AUTHORIZED: ${{ vars.TRUSTMRR_RESEARCH_AUTHORIZED }}
      TRUSTMRR_AI_AUTHORIZED: ${{ vars.TRUSTMRR_AI_AUTHORIZED }}
      NOTION_ENABLE_SYNC: 'true'
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: 4109e605-ccf8-81ed-a46c-f9ab95538f5b
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full live research and Notion READY integration
        run: python -m trustmrr.main integration-test

  produce:
    # A newly created repo is intentionally inert until cutover is approved.
    # Old systemd weekly timer must be disabled before this gate is enabled.
    if: github.event_name == 'schedule' && vars.TRUSTMRR_PRODUCTION_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRUSTMRR_PRODUCTION_ENABLED: ${{ vars.TRUSTMRR_PRODUCTION_ENABLED }}
      TRUSTMRR_RESEARCH_AUTHORIZED: ${{ vars.TRUSTMRR_RESEARCH_AUTHORIZED }}
      TRUSTMRR_AI_AUTHORIZED: ${{ vars.TRUSTMRR_AI_AUTHORIZED }}
      NOTION_ENABLE_SYNC: 'true'
      NOTION_AUTOSYNC_AFTER_GENERATION: 'true'
      NOTION_PARENT_PAGE_ID: 4109e605-ccf8-81ed-a46c-f9ab95538f5b
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce Notion READY weekly and conditional monthly
        run: python -m trustmrr.main produce
